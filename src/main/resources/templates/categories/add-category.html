<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Danh Mục Mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .form-card { max-width: 550px; margin: 50px auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

    <div class="container">
        <div class="card form-card border-0">
            <div class="card-header bg-success text-white py-3 rounded-top-3">
                <h4 class="mb-0 fw-bold">
                    <i class="bi bi-plus-circle me-2"></i>Thêm Danh Mục Mới
                </h4>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/categories/add}" th:object="${category}" method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Tên Danh Mục <span class="text-danger">*</span></label>
                        <input type="text" 
                               class="form-control form-control-lg" 
                               id="name" 
                               th:field="*{name}" 
                               placeholder="Nhập tên danh mục (ví dụ: Điện thoại, Laptop...)" 
                               required 
                               autofocus>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <a th:href="@{/categories}" class="btn btn-outline-secondary px-3 py-2">
                            <i class="bi bi-arrow-left me-1"></i> Quay lại
                        </a>
                        <button type="submit" class="btn btn-success px-4 py-2 fw-semibold">
                            <i class="bi bi-check-circle me-1"></i> Lưu Danh Mục
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
