<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập Nhật Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .form-card { max-width: 650px; margin: 40px auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .preview-img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; border: 1px solid #ced4da; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card form-card border-0">
            <div class="card-header bg-warning text-dark py-3 rounded-top-3">
                <h4 class="mb-0 fw-bold">
                    <i class="bi bi-pencil-square me-2"></i>Cập Nhật Thông Tin Sản Phẩm
                </h4>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/products/update/{id}(id=${product.id})}" th:object="${product}" method="post">
                    <!-- Trường ẩn ID -->
                    <input type="hidden" th:field="*{id}" />

                    <div class="row align-items-center mb-3">
                        <div class="col-md-9">
                            <label class="form-label text-muted">Mã Sản Phẩm (ID)</label>
                            <input type="text" class="form-control" th:value="*{id}" disabled readonly />
                        </div>
                        <div class="col-md-3 text-center" th:if="*{image != null and !image.isEmpty()}">
                            <label class="form-label text-muted d-block">Ảnh hiện tại</label>
                            <img th:src="*{image}" class="preview-img" alt="Ảnh xem trước"
                                 onerror="this.onerror=null; this.src='https://placehold.co/90x90?text=No+Img';">
                        </div>
                    </div>

                    <!-- Tên sản phẩm -->
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Tên Sản Phẩm <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" 
                               placeholder="Nhập tên sản phẩm..." required autofocus>
                    </div>

                    <div class="row">
                        <!-- Giá bán -->
                        <div class="col-md-6 mb-3">
                            <label for="price" class="form-label fw-semibold">Giá Bán (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="price" th:field="*{price}" 
                                   min="0" required>
                        </div>

                        <!-- Dropdown Chọn Danh mục -->
                        <div class="col-md-6 mb-3">
                            <label for="category" class="form-label fw-semibold">Danh Mục <span class="text-danger">*</span></label>
                            <select class="form-select" id="category" th:field="*{category.id}" required>
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="cat : ${categories}" 
                                        th:value="${cat.id}" 
                                        th:text="${cat.name}"
                                        th:selected="${product.category != null and product.category.id == cat.id}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <!-- URL Hình ảnh -->
                    <div class="mb-3">
                        <label for="image" class="form-label fw-semibold">Đường Dẫn Hình Ảnh (URL)</label>
                        <input type="url" class="form-control" id="image" th:field="*{image}" 
                               placeholder="https://example.com/image.jpg">
                    </div>

                    <!-- Mô tả sản phẩm -->
                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Mô Tả Sản Phẩm</label>
                        <textarea class="form-control" id="description" th:field="*{description}" 
                                  rows="4"></textarea>
                    </div>

                    <!-- Nút bấm -->
                    <div class="d-flex justify-content-between align-items-center mt-4 pt-2 border-top">
                        <a th:href="@{/products}" class="btn btn-outline-secondary px-3 py-2">
                            <i class="bi bi-arrow-left me-1"></i> Hủy Bỏ
                        </a>
                        <button type="submit" class="btn btn-warning px-4 py-2 fw-semibold">
                            <i class="bi bi-save me-1"></i> Lưu Cập Nhật
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
