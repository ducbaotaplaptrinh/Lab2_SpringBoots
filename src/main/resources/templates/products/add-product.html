<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Sản Phẩm Mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .form-card { max-width: 650px; margin: 40px auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

    <div class="container">
        <div class="card form-card border-0">
            <div class="card-header bg-success text-white py-3 rounded-top-3">
                <h4 class="mb-0 fw-bold">
                    <i class="bi bi-plus-circle me-2"></i>Thêm Sản Phẩm Mới
                </h4>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/products/add}" th:object="${product}" method="post">
                    <!-- Tên sản phẩm -->
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Tên Sản Phẩm <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" 
                               placeholder="Ví dụ: Laptop Dell XPS 15..." required autofocus>
                    </div>

                    <div class="row">
                        <!-- Giá bán -->
                        <div class="col-md-6 mb-3">
                            <label for="price" class="form-label fw-semibold">Giá Bán (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="price" th:field="*{price}" 
                                   min="0" placeholder="Ví dụ: 15000000" required>
                        </div>

                        <!-- Dropdown Chọn Danh mục -->
                        <div class="col-md-6 mb-3">
                            <label for="category" class="form-label fw-semibold">Danh Mục <span class="text-danger">*</span></label>
                            <select class="form-select" id="category" th:field="*{category.id}" required>
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="cat : ${categories}" 
                                        th:value="${cat.id}" 
                                        th:text="${cat.name}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <!-- URL Hình ảnh -->
                    <div class="mb-3">
                        <label for="image" class="form-label fw-semibold">Đường Dẫn Hình Ảnh (URL)</label>
                        <input type="url" class="form-control" id="image" th:field="*{image}" 
                               placeholder="https://example.com/image.jpg">
                        <small class="text-muted">Nhập đường link hình ảnh trực tuyến hoặc để trống</small>
                    </div>

                    <!-- Mô tả sản phẩm -->
                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Mô Tả Sản Phẩm</label>
                        <textarea class="form-control" id="description" th:field="*{description}" 
                                  rows="4" placeholder="Nhập tóm tắt đặc điểm nổi bật, cấu hình kỹ thuật..."></textarea>
                    </div>

                    <!-- Nút bấm -->
                    <div class="d-flex justify-content-between align-items-center mt-4 pt-2 border-top">
                        <a th:href="@{/products}" class="btn btn-outline-secondary px-3 py-2">
                            <i class="bi bi-arrow-left me-1"></i> Quay lại
                        </a>
                        <button type="submit" class="btn btn-success px-4 py-2 fw-semibold">
                            <i class="bi bi-check-circle me-1"></i> Thêm Mới Sản Phẩm
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
