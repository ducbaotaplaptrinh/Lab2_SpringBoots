spring.application.name=demo

# ===== CẤU HÌNH KẾT NỐI LARAGON MYSQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/WebBanHang?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== CẤU HÌNH JPA / HIBERNATE =====
# update: Hibernate tự động tạo/cập nhật cấu trúc bảng từ Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Giữ Hibernate session mở suốt request → Thymeleaf có thể đọc lazy relations
spring.jpa.open-in-view=true
